server {
    listen 80;
    server_name 192.168.56.199;

    # Serve React frontend
    root /var/www/weather-command-center/frontend;
    index index.html;

    # SPA fallback — send all unmatched routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend API
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection '';
        proxy_read_timeout 30s;
    }

    # Proxy health endpoint
    location /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/weather-command-center-access.log;
    error_log  /var/log/nginx/weather-command-center-error.log;
}
