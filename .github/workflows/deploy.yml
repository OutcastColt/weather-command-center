name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Dev VM
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Build frontend
        working-directory: frontend
        run: npm ci && VITE_API_BASE_URL=${{ secrets.API_BASE_URL || 'http://192.168.56.199/api' }} npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Set up SSH key
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/id_rsa
          echo "${{ secrets.VM_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Create directory structure on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sudo mkdir -p /var/www/weather-command-center/{backend,frontend} && \
             sudo chown -R \$USER:\$USER /var/www/weather-command-center"

      - name: Deploy backend
        run: |
          scp -r backend/dist/          ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/var/www/weather-command-center/backend/
          scp -r backend/node_modules/  ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/var/www/weather-command-center/backend/
          scp    backend/package.json   ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/var/www/weather-command-center/backend/
          scp    deploy/ecosystem.config.cjs ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/var/www/weather-command-center/

      - name: Write backend .env on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} "cat > /var/www/weather-command-center/backend/.env" <<'ENV'
          NODE_ENV=production
          PORT=3001
          CORS_ORIGINS=http://${{ secrets.VM_HOST }}
          WEATHER_CACHE_TTL_MINUTES=${{ secrets.WEATHER_CACHE_TTL_MINUTES || 15 }}
          ALERTS_CACHE_TTL_MINUTES=${{ secrets.ALERTS_CACHE_TTL_MINUTES || 5 }}
          ENV

      - name: Deploy frontend
        run: |
          scp -r frontend/dist/. ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/var/www/weather-command-center/frontend/

      - name: Install dependencies and restart backend on VM
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} bash <<'REMOTE'
          set -e
          if ! command -v node &>/dev/null; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi
          if ! command -v pm2 &>/dev/null; then
            sudo npm install -g pm2
          fi
          sudo mkdir -p /var/log/pm2
          cd /var/www/weather-command-center
          pm2 delete weather-api 2>/dev/null || true
          pm2 start ecosystem.config.cjs
          pm2 save
          REMOTE

      - name: Install Nginx config and reload
        run: |
          scp deploy/nginx.conf ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/weather-nginx.conf
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            "sudo cp /tmp/weather-nginx.conf /etc/nginx/sites-available/weather-command-center && \
             sudo ln -sf /etc/nginx/sites-available/weather-command-center /etc/nginx/sites-enabled/ && \
             sudo rm -f /etc/nginx/sites-enabled/default && \
             sudo nginx -t && sudo systemctl reload nginx"

      - name: Smoke test
        run: |
          sleep 3
          curl --fail http://${{ secrets.VM_HOST }}/health
          curl --fail "http://${{ secrets.VM_HOST }}/api/weather/current?city=corpus-christi"
          echo "Smoke tests passed."
